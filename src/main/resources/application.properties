server.port=${PORT:8080}

# MongoDB Atlas Connection
# Replace with your free Atlas cluster URI or set via MONGO_URI environment variable:
# Format: mongodb+srv://<username>:<password>@cluster0.xxxx.mongodb.net/campushub?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/campushub}
spring.data.mongodb.auto-index-creation=true

# JWT Settings
# 256-bit secret key for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# CORS Allowed Origin (e.g. Local Vite dev server or Vercel production frontend)
app.cors.allowed-origin=${CLIENT_URL:http://localhost:5173}
